<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KMap diagnostics</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 20px;color:#17231f}li{padding:8px}.pass{color:#246c50}.fail{color:#b22}</style></head><body><h1>KMap diagnostic checks</h1><p>Checks room code formatting and route generation in your browser.</p><ol id="results"><li>Running…</li></ol><script type="module">
import {buildGraph,makeRoomId} from './graph.js';import {findShortestPath} from './dijkstra.js';
const out=document.querySelector('#results');const rooms=await fetch('./rooms.json').then(r=>r.json());const graph=buildGraph(rooms);const checks=[['Room codes format correctly',makeRoomId(0,'A','12')==='A012'&&makeRoomId(1,'B','06')==='B106'],['Rooms exist in graph',graph.has('A010')&&graph.has('C201')],['Cross-floor shortest route found',!!findShortestPath(graph,'A010','C201')]];out.innerHTML=checks.map(([label,ok])=>'<li class="'+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+' — '+label+'</li>').join('');
</script></body></html>
